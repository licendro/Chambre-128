<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0053ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chambre 128 :: Planning</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#18181b;--mut:#71717a;--line:#e4e4e7;--soft:#f4f4f5;--green:#16a34a;--greenbg:#f0fdf4;--red:#dc2626;--redbg:#fef2f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom))}
.win{max-width:620px;margin:0 auto}
.hd{display:flex;align-items:flex-start;gap:10px;padding:8px 2px 16px}
.brand{font-size:30px;font-weight:800;letter-spacing:-.9px;line-height:1.1}
.slogan{color:var(--mut);font-size:13px;margin-top:3px}
.lk{margin-left:auto;padding-top:4px}
.tabs{display:flex;background:#e4e4e7;border-radius:13px;padding:3px;margin-bottom:16px}
.tabs button{flex:1;background:none;border:0;border-radius:10px;padding:9px 2px;font:600 13px -apple-system,system-ui,sans-serif;color:var(--mut);position:relative}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs .alert{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);vertical-align:middle;margin-left:4px;font-size:0}
.panel{min-height:200px}
.tblw{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
table.pl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}
.pl th,.pl td{text-align:center;vertical-align:middle;word-break:break-word;line-height:1.25}
.pl th{color:var(--mut);font-weight:600;font-size:10.5px;padding:11px 1px;border-bottom:1px solid var(--line);background:#fafafa}
.pl td{padding:10px 1px;border-bottom:1px solid var(--soft);font-weight:600}
.pl tr:last-child td{border-bottom:0}
.pl td.d{font-weight:700;font-size:12px}
.pl td.d small{color:#a1a1aa;font-weight:500;font-size:10px}
.pl tr.today td{background:var(--greenbg)}
.pl tr.today td.d{color:var(--green)}
.nm{display:block;padding:2px 1px}
.nm+.nm{margin-top:3px}
.nm.bad{background:var(--red);color:#fff!important;border-radius:6px;margin:1px 3px}
.pl.adm td.c{cursor:pointer}
.pl.adm td.c .nm{text-decoration:underline;text-decoration-color:#d4d4d8;text-underline-offset:3px}
.pl.adm td.c:active{background:var(--soft)}
.chef{background:var(--ink);color:#fff;border-radius:18px;padding:15px 17px;margin-bottom:12px}
.chef .t{font-size:11px;color:#a1a1aa;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.chef .n{font-size:21px;font-weight:700;margin:3px 0}
.chef .s{font-size:12.5px;color:#d4d4d8}
.chef .s b{color:#fff}
fieldset.grp{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 12px;padding:12px 14px 14px;min-width:0}
fieldset.grp legend{float:left;width:100%;padding:0;margin-bottom:6px;font-weight:700;font-size:15px}
fieldset.grp legend+*{clear:both}
fieldset.grp.bad{border-color:#fca5a5;background:var(--redbg)}
fieldset.grp.bad legend{color:var(--red)}
.st{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.st.ok{background:var(--greenbg);color:var(--green)}
.st.w{background:#fef9c3;color:#a16207}
.st.r{background:var(--red);color:#fff}
.sub{color:var(--mut);font-size:12.5px;margin-top:5px}
.row2{display:flex;gap:8px}
.btn{display:block;width:100%;margin-top:8px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:13px;font:600 14px -apple-system,system-ui,sans-serif;padding:12px 10px;text-align:center;text-decoration:none;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.go,.btn.gold{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{display:inline-block;width:auto;padding:7px 14px;margin:0;border-radius:99px;font-size:12.5px}
.lock.on{background:var(--ink);color:#fff;border-color:var(--ink)}
select,input,textarea{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:10px 11px;font-size:16px;font-family:inherit;width:100%}
textarea{resize:vertical}
.f{margin-bottom:10px}
.f span{display:block;font-weight:600;font-size:12.5px;color:var(--mut);margin-bottom:4px}
h4{font-size:15px;font-weight:700;margin:18px 0 8px}
p{margin:0 0 10px}
.hist{background:var(--soft);border-radius:12px;padding:9px 11px;margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;border-left:3px solid var(--red)}
.hist .x{background:#fff;border:1px solid var(--line);border-radius:99px;width:28px;height:28px;flex-shrink:0;font-size:13px;color:var(--mut)}
.prev{width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.hint{color:var(--mut);font-size:12px;text-align:center;margin:12px 0 0}
.err{color:var(--red);font-weight:600;font-size:12.5px;min-height:18px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.dlg{width:100%;max-width:620px;max-height:90vh;display:flex;flex-direction:column;margin:0;background:#fff;border-radius:22px 22px 0 0;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.tb{display:flex;align-items:center;gap:8px;padding:16px 18px 6px;font-weight:700;font-size:17px}
.tb .ctl{margin-left:auto}
.tb .ctl .x{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--mut);font-size:13px;cursor:pointer}
.wc{padding:8px 18px calc(20px + env(safe-area-inset-bottom));overflow:auto}
.pick{display:grid;gap:6px}
.days{display:flex;flex-wrap:wrap;gap:6px}
.pick .btn{text-align:left;margin:0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:10px 16px;font-size:13px;font-weight:500;z-index:30;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
</style>
</head>
<body>

<div class="win">
  <div class="hd">
    <div><div class="brand">Chambre 128</div><div class="slogan" id="slogan">4e compagnie</div></div>
    <div class="lk"><button id="lock" class="btn sm lock" onclick="lockBtn()">Admin</button></div>
  </div>
  <div class="tabs" id="nav"></div>
  <div class="panel" id="main"></div>
</div>

<div id="modal" class="modal" hidden></div>

<script>
const CODE='lapatate';
const KEY='ch128_data_v1';
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const DAYS_S=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const SDB='Salle de bain + poubelle';
const TASKS=[{l:'TIG divers'},{l:'TIG divers'},{l:SDB},{l:'Sol chambre'},{l:'Repos'}];
const SOL=3,REPOS=4;
const COLS=[{l:'TIG divers',s:'TIG'},{l:SDB,s:'SdB + poub.'},{l:'Sol chambre',s:'Sol'},{l:'Repos',s:'Repos'}];
const MOTIFS=['TIG divers',SDB,'Sol chambre','Lit mal fait','Affaires qui traînent','Autre'];
const COLORS=['#0046d5','#d35400','#7b1fa2','#00897b','#a67c00','#c2185b','#2e7d32'];

/* ---------- utilitaires ---------- */
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mondayISO(d){const x=new Date(d||new Date());x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)}
function dayDate(i){const d=new Date(state.week+'T12:00:00');d.setDate(d.getDate()+i);return d}
function fr(d){return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}
function frS(s){return fr(new Date(s+'T12:00:00'))}
function frLong(s){return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-')}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=id=>document.getElementById(id);

/* ---------- données ---------- */
const TYPES=['TIG divers',SDB,'Sol chambre','Repos'];
const capOf=ty=>TASKS.filter(t=>t.l===ty).length;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const solOn=(s,d)=>(s.solDays||[]).includes(d);
// tâche réelle d'un créneau : le créneau "sol" devient du repos les jours sans sol
function effT(s,d,t){return t===SOL&&!solOn(s,d)?'Repos':TASKS[t].l}
function typeOn(s,plan,d,n){const t=plan[d].indexOf(n);return t<0?null:effT(s,d,t)}
// créneaux affichés dans chaque colonne du tableau
function colSlots(s,d,k){return k===0?[0,1]:k===1?[2]:k===2?(solOn(s,d)?[SOL]:[]):(solOn(s,d)?[REPOS]:[REPOS,SOL])}
// Génère un planning : tâches fixes, limites par personne, jamais la même tâche 2 jours de suite (si possible), répartition équilibrée
const OPS={max:'au plus',min:'au moins',exact:'exactement'};
function countPlan(s,plan){const c={};s.members.forEach(n=>c[n]={});plan.forEach((day,d)=>day.forEach((n,t)=>{if(c[n]){const ty=effT(s,d,t);c[n][ty]=(c[n][ty]||0)+1}}));return c}
function ruleGap(r,c){const v=(c[r.name]||{})[r.task]||0;return r.op==='max'?Math.max(0,v-r.n):r.op==='min'?Math.max(0,r.n-v):Math.abs(v-r.n)}
function violations(s,plan){const c=countPlan(s,plan);return (s.rules||[]).filter(r=>s.members.includes(r.name)&&ruleGap(r,c)>0)}
function scorePlan(s,plan,free){
  let rep=0,bal=0,rv=0;const c=countPlan(s,plan);
  for(let d=1;d<7;d++)plan[d].forEach((n,t)=>{if(free.has(n)&&typeOn(s,plan,d-1,n)===effT(s,d,t))rep++});
  free.forEach(n=>Object.values(c[n]).forEach(v=>bal+=v*v));
  (s.rules||[]).forEach(r=>{if(c[r.name])rv+=ruleGap(r,c)});
  return rv*3000+rep*1000+bal;
}
function generate(s){
  const used=new Set(),fixedSlots=[];
  (s.fixed||[]).forEach(f=>{
    if(!s.members.includes(f.name))return;
    const t=TASKS.findIndex((x,i)=>x.l===f.task&&!used.has(i));
    if(t>=0){used.add(t);fixedSlots.push([t,f.name])}
  });
  const fixedNames=new Set(fixedSlots.map(x=>x[1]));
  const freeSlots=TASKS.map((_,i)=>i).filter(i=>!used.has(i));
  const freePeople=s.members.filter(m=>!fixedNames.has(m)),free=new Set(freePeople);
  let best=null,bestScore=Infinity;
  for(let run=0;run<30;run++){
    const plan=[];
    for(let d=0;d<7;d++){
      const day=new Array(TASKS.length).fill('—');
      fixedSlots.forEach(([t,n])=>day[t]=n);
      const p=shuffle([...freePeople]);
      freeSlots.forEach((t,j)=>{if(p[j])day[t]=p[j]});
      plan.push(day);
    }
    // amélioration par échanges successifs
    let cs=scorePlan(s,plan,free);
    for(let i=0;i<6000&&cs>0&&freeSlots.length>1;i++){
      const d=Math.floor(Math.random()*7),a=freeSlots[Math.floor(Math.random()*freeSlots.length)],b=freeSlots[Math.floor(Math.random()*freeSlots.length)];
      if(a===b)continue;const day=plan[d];[day[a],day[b]]=[day[b],day[a]];
      const ns=scorePlan(s,plan,free);
      if(ns<=cs)cs=ns;else [day[a],day[b]]=[day[b],day[a]];
    }
    if(cs<bestScore){bestScore=cs;best=plan.map(x=>[...x])}
  }
  return best;
}
const MERC_RULES=[{name:'MERCERON',task:'TIG divers',op:'max',n:1},{name:'MERCERON',task:'Repos',op:'exact',n:3}];
function defaults(){const m=['LALOUX','BONNET','ROS-WILMOT','USHMAEV','MERCERON'];const s={v:3,members:m,chef:'MERCERON',week:mondayISO(),plan:[],fixed:[],rules:MERC_RULES.map(r=>({...r})),solDays:[1,4],rappels:[],reports:[]};s.plan=generate(s);return s}
function norm(s){
  if(!(s&&Array.isArray(s.members)&&Array.isArray(s.plan)))return null;
  s.rappels=s.rappels||[];s.reports=s.reports||[];s.fixed=s.fixed||[];
  if(!s.v||s.v<2){ // passage poubelle -> salle de bain + poubelle, ajout repos, sol 2 jours
    s.v=2;s.solDays=[1,4];
    const fx=[];s.fixed.forEach(f=>{const t=(f.task==='Poubelle'||f.task==='Salle de bain')?SDB:f.task;if(TYPES.includes(t)&&fx.filter(x=>x.task===t).length<capOf(t)&&!fx.some(x=>x.name===f.name))fx.push({name:f.name,task:t})});
    s.fixed=fx;s.plan=generate(s);s._migrated=true;
  }
  s.solDays=s.solDays||[1,4];s.rules=s.rules||[];
  if(s.v<3){ // ajout des limites par personne
    s.v=3;if(!s.rules.length&&s.members.includes('MERCERON'))s.rules=MERC_RULES.map(r=>({...r}));
    s.plan=generate(s);s._migrated=true;
  }
  return s;
}
function load(){try{return norm(JSON.parse(localStorage.getItem(KEY)))||defaults()}catch(e){return defaults()}}
let state=load();
let tab='planning';

const rappelsOf=n=>state.rappels.filter(r=>r.name===n).sort((a,b)=>a.date.localeCompare(b.date));
const count=n=>rappelsOf(n).length;
const color=n=>'#18181b';
function tasksOf(n,d){return [...new Set(state.plan[d].map((p,t)=>p===n?effT(state,d,t):null).filter(Boolean))]}
const iconOf=l=>(TASKS.find(t=>t.l===l)||{i:'•'}).i;

/* ---------- synchro en ligne (Netlify) ---------- */
let admin=false,remote=false,saveT=null;
function getCode(){try{return localStorage.getItem('ch128_code')||''}catch(e){return''}}
function setCode(v){try{v?localStorage.setItem('ch128_code',v):localStorage.removeItem('ch128_code')}catch(e){}}
async function api(method,body){
  const h={'x-code':getCode()};if(body)h['Content-Type']='application/json';
  const r=await fetch('/api/data',{method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(r.status===401)throw new Error('401');
  if(!r.ok)throw new Error(String(r.status));
  if(!(r.headers.get('content-type')||'').includes('json'))throw new Error('nojson');
  return r.json();
}
async function sync(){
  try{
    const res=await api('GET');remote=true;admin=!!res.admin;
    const s=norm(res.state);
    if(s){const mig=s._migrated;delete s._migrated;state=s;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}if(mig&&admin)push()}
    else if(admin)push();
  }catch(e){remote=false;admin=getCode().trim().toLowerCase()===CODE}
  render();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(remote&&admin){clearTimeout(saveT);saveT=setTimeout(push,350)}
}
async function push(){try{await api('POST',state)}catch(e){toast(e.message==='401'?'Code refusé':'Pas enregistré en ligne, réessaie')}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&remote)sync()});

/* ---------- accès admin ---------- */
function lockBtn(){
  if(admin){
    modal(`<h3>Mode chef de chambre</h3><p>Tu peux modifier le planning, mettre des rappels et faire les comptes rendus. Les modifs sont visibles par tout le monde.</p>
    <button class="btn" onclick="logout()">Quitter le mode admin</button><button class="btn" onclick="closeModal()">Fermer</button>`);
    return;
  }
  modal(`<h3>Accès chef de chambre</h3><p>Entre le code pour modifier le planning et gérer les rappels.</p>
  <input id="code" type="password" placeholder="Code d'accès" autocomplete="off" autocapitalize="off">
  <div class="err" id="err"></div>
  <div class="row2"><button class="btn go" onclick="tryLogin()">OK</button><button class="btn" onclick="closeModal()">Annuler</button></div>`);
  setTimeout(()=>{const c=$('code');if(c){c.focus();c.onkeydown=e=>{if(e.key==='Enter')tryLogin()}}},60);
}
async function tryLogin(){
  const v=$('code').value.trim();setCode(v);
  if(remote)await sync();else admin=v.toLowerCase()===CODE;
  if(admin){closeModal();render();toast('Mode admin activé')}
  else{setCode('');const e=$('err');if(e){e.textContent='Code incorrect';$('code').value=''}}
}
function logout(){setCode('');admin=false;tab='planning';closeModal();if(remote)sync();else render();toast('Mode admin désactivé')}

/* ---------- rendu ---------- */
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  const lk=$('lock');lk.textContent=admin?'Admin ✓':'Admin';$('slogan').textContent=`4e compagnie · Semaine du ${fr(dayDate(0))} au ${fr(dayDate(6))}`;lk.className='btn sm lock'+(admin?' on':'');
  if(!admin&&tab==='equipe')tab='planning';
  const alert=admin&&state.members.some(m=>count(m)>=2);
  const tabs=admin?[['planning','Planning'],['equipe','Rappels'],['export','Images'],['reglages','Réglages']]:[['planning','Planning'],['export','Images']];
  if(!tabs.some(t=>t[0]===tab))tab='planning';
  $('nav').innerHTML=tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}${k==='equipe'&&alert?' <span class="alert">●</span>':''}</button>`).join('');
  $('main').innerHTML=({planning:vPlanning,equipe:vEquipe,export:vExport,reglages:vReglages})[tab]();
}

function nameTag(n){return `<span class="nm ${admin&&count(n)>=2?'bad':''}" style="color:${color(n)}">${esc(n)}</span>`}

function vPlanning(){
  const today=iso(new Date());
  let h=`<div class="chef"><div class="t">Chef de chambre</div><div class="n">${esc(state.chef)}</div><div class="s">Vérification <b>tous les jours</b> : lits faits, rien qui traîne, rangement.</div></div>`;
  h+=`<div class="tblw"><table class="pl ${admin?'adm':''}"><colgroup><col style="width:15%"><col><col><col><col></colgroup>
  <thead><tr><th>Jour</th>${COLS.map(c=>`<th>${c.s}</th>`).join('')}</tr></thead><tbody>`;
  DAYS.forEach((dn,d)=>{
    const dd=dayDate(d),isT=iso(dd)===today;
    h+=`<tr class="${isT?'today':''}"><td class="d">${DAYS_S[d]}<br><small>${fr(dd)}</small></td>`;
    COLS.forEach((c,k)=>{
      const sl=colSlots(state,d,k);
      h+=`<td class="c">${sl.length?sl.map(t=>`<span ${admin?`onclick="pick(${d},${t})"`:''}>${nameTag(state.plan[d][t])}</span>`).join(''):'<span class="nm" style="color:#d4d4d8">—</span>'}</td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+=`<p class="hint">Sol de la chambre : ${state.solDays.length?state.solDays.slice().sort().map(d=>DAYS[d].toLowerCase()).join(' et '):'aucun jour'} · les autres jours, la personne du sol est au repos.</p>`;
  if((state.fixed||[]).length)h+=`<p class="hint">Tous les jours : ${state.fixed.map(f=>`${esc(f.name)} = ${esc(f.task)}`).join(' · ')}</p>`;
  if(admin){
    h+=`<h4>Modifier le planning</h4>
    <button class="btn gold" onclick="mix()">Mix aléatoire</button>
    <p class="hint">Le mix évite que quelqu'un refasse la même tâche 2 jours de suite et respecte les tâches fixes (Réglages).<br>Pour modifier à la main, appuie sur un nom dans le tableau.</p>`;
  }else{
    h+=`<p class="hint">Lecture seule · le chef de chambre modifie via Admin</p>`;
  }
  return h;
}
function pick(d,t){
  if(!admin)return;
  const cur=state.plan[d][t];
  modal(`<h3>${DAYS[d]} · ${effT(state,d,t)}</h3><div class="pick">${state.members.map((m,i)=>`<button class="btn ${m===cur?'gold':''}" onclick="setCell(${d},${t},${i})">${m===cur?'&gt; ':''}${esc(m)}</button>`).join('')}</div>
  <button class="btn" onclick="closeModal()">Annuler</button>`);
}
function setCell(d,t,i){
  if(!admin)return;const n=state.members[i];state.plan[d][t]=n;save();closeModal();render();
  const ty=effT(state,d,t),fixe=(state.fixed||[]).some(f=>f.name===n&&f.task===ty);
  if(!fixe&&((d>0&&typeOn(state,state.plan,d-1,n)===ty)||(d<6&&typeOn(state,state.plan,d+1,n)===ty)))toast(`Attention : ${n} fait ${ty} 2 jours de suite`);
  else toast('Planning modifié');
}
function mix(){
  if(!admin)return;
  if(!confirm('Mélanger le planning au hasard ? Le planning actuel sera remplacé.'))return;
  state.plan=generate(state);save();render();warnRules('Planning mélangé');
}
function addFixed(){
  if(!admin)return;
  const n=$('fxn').value,ty=$('fxt').value;if(!n||!ty)return;
  state.fixed=(state.fixed||[]).filter(f=>f.name!==n);
  if(state.fixed.filter(f=>f.task===ty).length>=capOf(ty)){toast(`${ty} : déjà ${capOf(ty)} personne(s) fixe(s)`);return}
  state.fixed.push({name:n,task:ty});state.plan=generate(state);save();render();toast(`${n} = ${ty} tous les jours`);
}
function warnRules(ok){const v=violations(state,state.plan);toast(v.length?`Impossible de respecter : ${v.map(r=>`${r.name} ${r.task}`).join(', ')}`:ok)}
function addRule(){
  if(!admin)return;
  const r={name:$('rln').value,task:$('rlt').value,op:$('rlo').value,n:Math.max(0,Math.min(7,parseInt($('rlv').value,10)||0))};
  state.rules=(state.rules||[]).filter(x=>!(x.name===r.name&&x.task===r.task));state.rules.push(r);
  state.plan=generate(state);save();render();warnRules('Limite ajoutée, planning refait');
}
function delRule(k){if(!admin)return;state.rules.splice(k,1);state.plan=generate(state);save();render();toast('Limite retirée, planning refait')}
function toggleSol(d){if(!admin)return;const a=new Set(state.solDays);a.has(d)?a.delete(d):a.add(d);state.solDays=[...a].sort();state.plan=generate(state);save();render();toast(`Sol : ${state.solDays.length} jour(s) / semaine · planning refait`)}
function delFixed(k){if(!admin)return;state.fixed.splice(k,1);state.plan=generate(state);save();render();toast('Tâche fixe retirée, planning refait')}

function preTask(i){
  const v=$('rd').value;if(!v)return;

function saveRappel(i){

function histo(i){

  ${rs.length?rs.map(r=>`<div class="hist"><div><b>${frS(r.date)}</b> · ${esc(r.task)}<div class="sub">${esc(r.motif||'—')}</div></div><button class="x" onclick="delRappel('${r.id}',${i})"></button></div>`).join(''):'<p>Aucun rappel.</p>'}

function delRappel(id,i){if(!confirm('Supprimer ce rappel ?'))return;state.rappels=state.rappels.filter(r=>r.id!==id);save();render();histo(i)}
function resetRappels(i){const m=state.members[i];if(!confirm(`Remettre les rappels de ${m} à zéro ?`))return;state.rappels=state.rappels.filter(r=>r.name!==m);save();closeModal();render();toast('Rappels remis à zéro')}

/* ---------- compte rendu ---------- */
function compteRendu(i){
  const m=state.members[i],rs=rappelsOf(m);

  <p class="sub" style="margin-top:0">Rédigé par ${esc(state.chef)}, chef de chambre</p>
  <h4>Manquements (${rs.length})</h4>
  ${rs.map(r=>`<div class="hist"><div><b>${esc(frLong(r.date))}</b><div>${esc(r.task)} — ${esc(r.motif||'—')}</div></div></div>`).join('')}
  <div class="f" style="margin-top:10px"><span>Observations du chef de chambre</span><textarea id="obs" rows="4">${esc(obs)}</textarea></div>

function saveReport(i){

function reportText(r){
  return `COMPTE RENDU — Chambre 128\nConcerné : ${r.name}\nRédigé par : ${r.chef}, chef de chambre\nDate : ${frLong(r.date)}\n\nManquements constatés (${r.items.length}) :\n`+
    r.items.map(it=>`- ${frLong(it.date)} : ${it.task} — ${it.motif||'—'}`).join('\n')+`\n\nObservations :\n${r.obs||'—'}`;
}
function showReport(id){
  const r=state.reports.find(x=>x.id===id);if(!r)return;
  showImg(drawReport(r),`compte-rendu-${slug(r.name)}-${r.date}.png`,`Compte rendu — ${r.name}`,
    `<button class="btn" onclick="copyReport('${id}')">Copier le texte</button><button class="btn" style="color:#c00" onclick="delReport('${id}')">Supprimer ce compte rendu</button>`);

function copyReport(id){
  const r=state.reports.find(x=>x.id===id);
  if(navigator.clipboard)navigator.clipboard.writeText(reportText(r)).then(()=>toast('Texte copié'),()=>toast('Copie impossible'));
  else toast('Copie impossible');
}
function delReport(id){if(!confirm('Supprimer ce compte rendu ?'))return;state.reports=state.reports.filter(r=>r.id!==id);save();closeModal();render()}

function setWeek(v){if(!v)return;state.week=mondayISO(new Date(v+'T12:00:00'));save();render();toast('Semaine mise à jour')}
function setChef(v){state.chef=v;save();render();toast('Chef de chambre : '+v)}
function rename(i,v){
  v=v.trim().toUpperCase();const old=state.members[i];
  if(!v||v===old||state.members.includes(v)){render();return}
  state.members[i]=v;
  state.plan=state.plan.map(day=>day.map(n=>n===old?v:n));
  state.rappels.forEach(r=>{if(r.name===old)r.name=v});
  state.reports.forEach(r=>{if(r.name===old)r.name=v;if(r.chef===old)r.chef=v});
  if(state.chef===old)state.chef=v;
  (state.fixed||[]).forEach(f=>{if(f.name===old)f.name=v});
  (state.rules||[]).forEach(r=>{if(r.name===old)r.name=v});
  save();render();toast('Nom modifié');
}
function exportJSON(){
  const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});

function importJSON(inp){

  rd.onload=()=>{try{const s=norm(JSON.parse(rd.result));if(!s)throw 0;state=s;save();render();toast('Sauvegarde importée')}catch(e){toast('Fichier invalide')}};

}

/* ---------- dessin des images (style moderne) ---------- */
const INK='#18181b',MUT='#71717a',LINE='#e4e4e7',BG='#f4f4f5';
const F=(s,w)=>`${w||'700'} ${s}px -apple-system, "SF Pro Text", Inter, system-ui, "Segoe UI", Roboto, Arial, sans-serif`;
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function txt(x,s,X,Y,font,col,al){x.font=font;x.fillStyle=col;x.textAlign=al||'left';x.textBaseline='middle';x.fillText(s,X,Y)}
function fit(x,s,maxW,size,w){let z=size;x.font=F(z,w);while(x.measureText(s).width>maxW&&z>10){z--;x.font=F(z,w)}return F(z,w)}
function wrap(x,t,w){const out=[];String(t).split('\n').forEach(p=>{let line='';p.split(' ').forEach(word=>{const test=line?line+' '+word:word;if(x.measureText(test).width>w&&line){out.push(line);line=word}else line=test});out.push(line)});return out}
function chefCard(x,X,Y,w,name,txtLine){
  x.fillStyle=INK;rr(x,X,Y,w,130,30);x.fill();
  txt(x,'CHEF DE CHAMBRE',X+36,Y+36,F(20,'600'),'#a1a1aa');
  txt(x,name,X+36,Y+74,F(38,'700'),'#fff');
  txt(x,txtLine,X+36,Y+108,fit(x,txtLine,w-72,22,'500'),'#d4d4d8');
}
function tableCard(x,X,Y,w,headH,rowH,cols,rows){
  // cols: [{l,w}] ; rows: array of arrays of cell contents (string | string[] | {t,sub})
  const H=headH+rowH*rows.length;
  x.save();rr(x,X,Y,w,H,30);x.fillStyle='#fff';x.fill();x.clip();
  x.fillStyle='#fafafa';x.fillRect(X,Y,w,headH);
  x.fillStyle=LINE;x.fillRect(X,Y+headH-2,w,2);
  let cx=X;cols.forEach(c=>{txt(x,c.l,cx+c.w/2,Y+headH/2,fit(x,c.l,c.w-16,22,'600'),MUT,'center');cx+=c.w});
  rows.forEach((r,i)=>{
    const y=Y+headH+i*rowH;
    if(i)x.fillStyle='#f0f0f1',x.fillRect(X+20,y,w-40,2);
    let cx=X;
    r.forEach((v,k)=>{
      const cw=cols[k].w,mx=cx+cw/2,my=y+rowH/2;
      if(v&&typeof v==='object'&&!Array.isArray(v)){txt(x,v.t,mx,my-15,F(26,'700'),INK,'center');txt(x,v.sub,mx,my+18,F(19,'500'),'#a1a1aa','center')}
      else if(Array.isArray(v)){v.forEach((n,j)=>txt(x,n,mx,my+(j?20:-20),fit(x,n,cw-20,24,'600'),INK,'center'))}
      else txt(x,v,mx,my,fit(x,v,cw-20,26,'600'),(v==='Repos'||v==='—')?'#a1a1aa':INK,'center');
      cx+=cw;
    });
  });
  x.restore();
  x.strokeStyle=LINE;x.lineWidth=2;rr(x,X,Y,w,H,30);x.stroke();
  return Y+H;
}

function drawGlobal(){
  const W=1400,P=60,headH=72,rowH=110;
  const H=P+250+headH+7*rowH+P;
  const c=cv(W,H),x=c.getContext('2d');x.fillStyle=BG;x.fillRect(0,0,W,H);
  txt(x,'Chambre 128',P,P+36,F(64,'800'),INK);
  txt(x,`4e compagnie · Semaine du ${fr(dayDate(0))} au ${fr(dayDate(6))}`,P,P+92,F(26,'500'),MUT);
  chefCard(x,P,P+130,W-2*P,state.chef,'Vérification des lits et du rangement tous les jours');
  const dayW=200,cw=(W-2*P-dayW)/4;
  const cols=[{l:'Jour',w:dayW},...COLS.map(co=>({l:co.l,w:cw}))];
  const rows=DAYS.map((dn,d)=>[{t:dn,sub:fr(dayDate(d))},...COLS.map((co,k)=>{const n=colSlots(state,d,k).map(t=>state.plan[d][t]);return n.length>1?n:(n[0]||'—')})]);
  tableCard(x,P,P+290,W-2*P,headH,rowH,cols,rows);
  return c;
}

function drawPerson(i){
  const m=state.members[i],isChef=m===state.chef,W=1080,P=56,headH=70,rowH=104;
  const top=P+(isChef?300:160),H=top+headH+7*rowH+P;
  const c=cv(W,H),x=c.getContext('2d');x.fillStyle=BG;x.fillRect(0,0,W,H);
  txt(x,'Planning de',P,P+20,F(26,'600'),MUT);
  txt(x,m,P,P+72,fit(x,m,W-2*P,64,'800'),INK);
  txt(x,`Chambre 128 · Semaine du ${fr(dayDate(0))} au ${fr(dayDate(6))}`,P,P+122,F(24,'500'),MUT);
  if(isChef)chefCard(x,P,P+150,W-2*P,m,'Vérification des lits et du rangement tous les jours');
  const dayW=240;
  const cols=[{l:'Jour',w:dayW},{l:'Tâche',w:W-2*P-dayW}];
  const rows=DAYS.map((dn,d)=>{const ts=tasksOf(m,d);return[{t:dn,sub:fr(dayDate(d))},ts.length?ts.join(' + '):'Repos']});
  tableCard(x,P,top,W-2*P,headH,rowH,cols,rows);
  return c;
}

function drawReport(r){
  const W=1240,P=80,maxW=W-2*P;
  const m=cv(10,10).getContext('2d');
  m.font=F(26,'500');const itemLines=r.items.map(it=>wrap(m,`${it.task} — ${it.motif||'—'}`,maxW-80));
  const obsLines=wrap(m,r.obs||'—',maxW-60);
  const itemsH=itemLines.reduce((s,l)=>s+50+l.length*36+16,0);
  const H=P+420+itemsH+90+obsLines.length*38+60+200;
  const c=cv(W,H),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
  txt(x,'Compte rendu',P,P+30,F(60,'800'),INK);
  txt(x,'Chambre 128 · 4e compagnie',P,P+86,F(26,'500'),MUT);
  x.fillStyle=BG;rr(x,P,P+130,maxW,190,24);x.fill();
  [['Concerné',r.name],['Rédigé par',r.chef+', chef de chambre'],['Date',frLong(r.date)],['Manquements',String(r.items.length)]].forEach(([k,v],i)=>{
    txt(x,k,P+30,P+170+i*40,F(24,'500'),MUT);txt(x,v,P+260,P+170+i*40,F(24,i===0||i===3?'700':'500'),i===3?'#dc2626':INK);
  });
  let y=P+370;
  txt(x,'Manquements constatés',P,y,F(30,'700'),INK);y+=36;
  r.items.forEach((it,k)=>{
    const bh=50+itemLines[k].length*36;
    x.fillStyle='#fef2f2';rr(x,P,y,maxW,bh,18);x.fill();x.fillStyle='#dc2626';x.fillRect(P,y+14,5,bh-28);
    txt(x,frLong(it.date),P+30,y+30,F(24,'700'),INK);
    itemLines[k].forEach((l,j)=>txt(x,l,P+30,y+66+j*36,F(24,'500'),'#3f3f46'));
    y+=bh+16;
  });
  y+=30;txt(x,'Observations du chef de chambre',P,y,F(30,'700'),INK);y+=46;
  obsLines.forEach((l,j)=>txt(x,l,P,y+j*38,F(25,'500'),'#3f3f46'));
  y+=obsLines.length*38+60;
  txt(x,'Signature du chef de chambre',W-P-440,y,F(22,'500'),MUT);
  x.fillStyle=LINE;x.fillRect(W-P-440,y+100,440,2);
  txt(x,r.chef,W-P,y+130,F(22,'600'),MUT,'right');
  return c;
}

let lastImg=null;
function showImg(c,name,title,extra){
  const url=c.toDataURL('image/png');lastImg={c,name};
  modal(`<h3>${esc(title)}</h3><img class="prev" src="${url}" alt="">
  <a class="btn go" href="${url}" download="${esc(name)}">Télécharger l'image</a>
  <button class="btn" onclick="shareImg()">Partager (Snap, WhatsApp…)</button>
  ${extra||''}
  <p class="hint">Sur iPhone : appui long sur l'image → « Enregistrer dans Photos »</p>
  <button class="btn" onclick="closeModal()">Fermer</button>`);
}
function shareImg(){
  if(!lastImg)return;
  lastImg.c.toBlob(async b=>{
    const f=new File([b],lastImg.name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
    else toast('Partage indisponible, utilise Télécharger');
  },'image/png');
}
function exportGlobal(){showImg(drawGlobal(),`planning-chambre-128-${state.week}.png`,'Planning global')}
function exportPerson(i){const m=state.members[i];showImg(drawPerson(i),`planning-${slug(m)}-${state.week}.png`,'Planning — '+m)}

/* ---------- démarrage ---------- */
admin=getCode().trim().toLowerCase()===CODE;
render();
sync();
</script>
