<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0053ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chambre 128 :: Planning</title>
<style>
:root{--bg:#0a0d0a;--fg:#33ff66;--dim:#1e8c3e;--hi:#0f2a16;--red:#ff4a4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 "Courier New",Courier,monospace;min-height:100vh;
  padding:calc(10px + env(safe-area-inset-top)) 8px calc(100px + env(safe-area-inset-bottom))}
.win{max-width:660px;margin:0 auto;border:2px solid var(--fg);background:var(--bg)}
.tb{border-bottom:2px solid var(--fg);padding:8px 10px;font-weight:bold;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:1px}
.tb .ctl{margin-left:auto}
.tb .ctl span{cursor:pointer;padding:0 4px}
.wc{padding:10px}
.hd{display:flex;align-items:center;gap:10px;padding:14px 10px;border-bottom:2px solid var(--fg)}
.brand{font-size:24px;font-weight:bold;letter-spacing:4px}
.slogan{color:var(--dim);font-size:12px;letter-spacing:1px}
.lk{margin-left:auto}
.tabs{display:flex;border-bottom:2px solid var(--fg)}
.tabs button{flex:1;background:none;color:var(--fg);border:0;border-right:1px solid var(--dim);font:bold 13px "Courier New",monospace;padding:11px 2px;text-transform:uppercase}
.tabs button:last-child{border-right:0}
.tabs button.on{background:var(--fg);color:var(--bg)}
.tabs .alert{color:var(--red)}
.tabs button.on .alert{color:#900}
.panel{padding:10px;min-height:200px}
table.pl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px;border:2px solid var(--fg)}
.pl th,.pl td{border:1px solid var(--dim);padding:7px 2px;text-align:center;vertical-align:middle;word-break:break-word;line-height:1.25}
.pl th{border-bottom:2px solid var(--fg);font-weight:bold;text-transform:uppercase;font-size:10.5px}
.pl td.d{font-weight:bold;font-size:12px}
.pl td.d small{color:var(--dim);font-weight:normal;font-size:10px}
.pl tr.today td{background:var(--hi)}
.nm{font-weight:bold;display:block;padding:2px 1px}
.nm+.nm{border-top:1px dashed var(--dim);margin-top:3px;padding-top:5px}
.nm.bad{background:var(--red);color:#000!important}
.pl.adm td.c{cursor:pointer}
.pl.adm td.c .nm{text-decoration:underline}
.pl.adm td.c:active{background:var(--hi)}
.chef{border:2px solid var(--fg);padding:10px;margin-bottom:10px;text-align:center}
.chef .t{color:var(--dim);font-size:12px;letter-spacing:2px}
.chef .n{font-size:22px;font-weight:bold;letter-spacing:3px;margin:2px 0}
.chef .s{font-size:12px}
@keyframes bl{50%{opacity:0}}
.blink{animation:bl 1s steps(1) infinite}
fieldset.grp{border:1px solid var(--dim);margin:0 0 10px;padding:6px 8px 8px}
fieldset.grp legend{font-weight:bold;padding:0 6px;letter-spacing:1px}
fieldset.grp.bad{border:2px solid var(--red)}
fieldset.grp.bad legend,.st.r{color:var(--red)}
.st{font-weight:bold;font-size:12px}
.st.w{color:var(--fg)}
.sub{color:var(--dim);font-size:12px;margin-top:4px}
.row2{display:flex;gap:6px}
.row2 .btn{margin-top:6px}
.btn{display:block;width:100%;margin-top:6px;background:none;color:var(--fg);border:1px solid var(--fg);font:bold 13px "Courier New",Courier,monospace;padding:10px 8px;text-transform:uppercase;text-align:center;text-decoration:none;cursor:pointer;letter-spacing:1px}
.btn:active,.btn.go,.btn.gold{background:var(--fg);color:var(--bg)}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.red:active{background:var(--red);color:#000}
.btn.sm{display:inline-block;width:auto;padding:6px 10px;margin:0}
.lock.on{background:var(--fg);color:var(--bg)}
select,input,textarea{background:#000;color:var(--fg);border:1px solid var(--fg);border-radius:0;padding:7px;font-size:16px;font-family:"Courier New",Courier,monospace;width:100%}
.f{margin-bottom:8px}
.f span{display:block;font-weight:bold;font-size:12px;margin-bottom:3px;text-transform:uppercase}
h4{font-size:13px;margin:14px 0 6px;border-bottom:1px solid var(--dim);padding-bottom:3px;text-transform:uppercase;letter-spacing:1px}
p{margin:0 0 8px}
.hist{border:1px solid var(--dim);border-left:4px solid var(--red);padding:6px 8px;margin-bottom:6px;font-size:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.hist .x{background:none;border:1px solid var(--dim);color:var(--fg);font:bold 12px monospace;padding:1px 6px}
.prev{width:100%;border:1px solid var(--dim);display:block}
.hint{color:var(--dim);font-size:11px;text-align:center;margin:10px 0 0}
.err{color:var(--red);font-weight:bold;font-size:12px;min-height:16px;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:10px;z-index:20}
.dlg{width:100%;max-width:460px;max-height:88vh;display:flex;flex-direction:column;margin:0}
.dlg .wc{overflow:auto}
.pick{display:grid;gap:4px}
.pick .btn{text-align:left;margin:0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:8px 12px;font:bold 12px "Courier New",monospace;z-index:30;max-width:90vw;text-transform:uppercase}
</style>
</head>
<body>

<div class="win">
  <div class="hd">
    <div><div class="brand">CHAMBRE 128</div><div class="slogan">4E COMPAGNIE</div></div>
    <div class="lk"><button id="lock" class="btn sm lock" onclick="lockBtn()">ADMIN</button></div>
  </div>
  <div class="tabs" id="nav"></div>
  <div class="panel" id="main"></div>
</div>

<div id="modal" class="modal" hidden></div>

<script>
const CODE='lapatate';
const KEY='ch128_data_v1';
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const DAYS_S=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const TASKS=[{l:'TIG divers',i:''},{l:'TIG divers',i:''},{l:'Poubelle',i:''},{l:'Sol chambre',i:''},{l:'Salle de bain',i:''}];
const COLS=[{l:'TIG divers',s:'TIG',i:'',t:[0,1]},{l:'Poubelle',s:'Poub.',i:'',t:[2]},{l:'Sol chambre',s:'Sol',i:'',t:[3]},{l:'Salle de bain',s:'S. de bain',i:'',t:[4]}];
const MOTIFS=['TIG divers','Poubelle','Sol chambre','Salle de bain','Lit mal fait','Affaires qui traînent','Autre'];
const COLORS=['#0046d5','#d35400','#7b1fa2','#00897b','#a67c00','#c2185b','#2e7d32'];

/* ---------- utilitaires ---------- */
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mondayISO(d){const x=new Date(d||new Date());x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)}
function dayDate(i){const d=new Date(state.week+'T12:00:00');d.setDate(d.getDate()+i);return d}
function fr(d){return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}
function frS(s){return fr(new Date(s+'T12:00:00'))}
function frLong(s){return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-')}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=id=>document.getElementById(id);

/* ---------- données ---------- */
const TYPES=['TIG divers','Poubelle','Sol chambre','Salle de bain'];
const capOf=ty=>TASKS.filter(t=>t.l===ty).length;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function typeOn(plan,d,n){const t=plan[d].indexOf(n);return t<0?null:TASKS[t].l}
// Génère un planning : tâches fixes respectées, jamais la même tâche 2 jours de suite (si possible), répartition équilibrée
function generate(s){
  const used=new Set(),fixedSlots=[];
  (s.fixed||[]).forEach(f=>{
    if(!s.members.includes(f.name))return;
    const t=TASKS.findIndex((x,i)=>x.l===f.task&&!used.has(i));
    if(t>=0){used.add(t);fixedSlots.push([t,f.name])}
  });
  const fixedNames=new Set(fixedSlots.map(x=>x[1]));
  const freeSlots=TASKS.map((_,i)=>i).filter(i=>!used.has(i));
  const freePeople=s.members.filter(m=>!fixedNames.has(m));
  let best=null,bestScore=Infinity;
  for(let it=0;it<400;it++){
    const plan=[];let rep=0;
    for(let d=0;d<7;d++){
      let bestDay=null,bestDayRep=Infinity;
      for(let k=0;k<40&&bestDayRep>0;k++){
        const day=new Array(TASKS.length).fill('—');
        fixedSlots.forEach(([t,n])=>day[t]=n);
        const p=shuffle([...freePeople]);
        freeSlots.forEach((t,j)=>{if(p[j])day[t]=p[j]});
        let r=0;
        if(d>0)freeSlots.forEach(t=>{if(day[t]!=='—'&&typeOn(plan,d-1,day[t])===TASKS[t].l)r++});
        if(r<bestDayRep){bestDayRep=r;bestDay=day}
      }
      rep+=bestDayRep;plan.push(bestDay);
    }
    let bal=0;
    freePeople.forEach(n=>{const c={};plan.forEach((day,d)=>{const ty=typeOn(plan,d,n);if(ty)c[ty]=(c[ty]||0)+1});Object.values(c).forEach(v=>bal+=v*v)});
    const score=rep*1000+bal;
    if(score<bestScore){bestScore=score;best=plan}
  }
  return best;
}
function defaults(){const m=['LALOUX','BONNET','ROS-WILMOT','USHMAEV','MERCERON'];const s={members:m,chef:'MERCERON',week:mondayISO(),plan:[],fixed:[],rappels:[],reports:[]};s.plan=generate(s);return s}
function norm(s){if(s&&Array.isArray(s.members)&&Array.isArray(s.plan)){s.rappels=s.rappels||[];s.reports=s.reports||[];s.fixed=s.fixed||[];return s}return null}
function load(){try{return norm(JSON.parse(localStorage.getItem(KEY)))||defaults()}catch(e){return defaults()}}
let state=load();
let tab='planning';

const rappelsOf=n=>state.rappels.filter(r=>r.name===n).sort((a,b)=>a.date.localeCompare(b.date));
const count=n=>rappelsOf(n).length;
const color=n=>'#33ff66';
function tasksOf(n,d){return [...new Set(state.plan[d].map((p,t)=>p===n?TASKS[t].l:null).filter(Boolean))]}
const iconOf=l=>(TASKS.find(t=>t.l===l)||{i:'•'}).i;

/* ---------- synchro en ligne (Netlify) ---------- */
let admin=false,remote=false,saveT=null;
function getCode(){try{return localStorage.getItem('ch128_code')||''}catch(e){return''}}
function setCode(v){try{v?localStorage.setItem('ch128_code',v):localStorage.removeItem('ch128_code')}catch(e){}}
async function api(method,body){
  const h={'x-code':getCode()};if(body)h['Content-Type']='application/json';
  const r=await fetch('/api/data',{method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(r.status===401)throw new Error('401');
  if(!r.ok)throw new Error(String(r.status));
  if(!(r.headers.get('content-type')||'').includes('json'))throw new Error('nojson');
  return r.json();
}
async function sync(){
  try{
    const res=await api('GET');remote=true;admin=!!res.admin;
    const s=norm(res.state);
    if(s){state=s;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
    else if(admin)push();
  }catch(e){remote=false;admin=getCode().trim().toLowerCase()===CODE}
  render();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(remote&&admin){clearTimeout(saveT);saveT=setTimeout(push,350)}
}
async function push(){try{await api('POST',state)}catch(e){toast(e.message==='401'?'Code refusé':'Pas enregistré en ligne, réessaie')}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&remote)sync()});

/* ---------- accès admin ---------- */
function lockBtn(){
  if(admin){
    modal(`<h3>Mode chef de chambre</h3><p>Tu peux modifier le planning, mettre des rappels et faire les comptes rendus. Les modifs sont visibles par tout le monde.</p>
    <button class="btn" onclick="logout()">Quitter le mode admin</button><button class="btn" onclick="closeModal()">Fermer</button>`);
    return;
  }
  modal(`<h3>Accès chef de chambre</h3><p>Entre le code pour modifier le planning et gérer les rappels.</p>
  <input id="code" type="password" placeholder="Code d'accès" autocomplete="off" autocapitalize="off">
  <div class="err" id="err"></div>
  <div class="row2"><button class="btn go" onclick="tryLogin()">OK</button><button class="btn" onclick="closeModal()">Annuler</button></div>`);
  setTimeout(()=>{const c=$('code');if(c){c.focus();c.onkeydown=e=>{if(e.key==='Enter')tryLogin()}}},60);
}
async function tryLogin(){
  const v=$('code').value.trim();setCode(v);
  if(remote)await sync();else admin=v.toLowerCase()===CODE;
  if(admin){closeModal();render();toast('Mode admin activé')}
  else{setCode('');const e=$('err');if(e){e.textContent='Code incorrect';$('code').value=''}}
}
function logout(){setCode('');admin=false;tab='planning';closeModal();if(remote)sync();else render();toast('Mode admin désactivé')}

/* ---------- rendu ---------- */
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  const lk=$('lock');lk.textContent=admin?'ADMIN ':'ADMIN';lk.className='btn sm lock'+(admin?' on':'');
  if(!admin&&tab==='equipe')tab='planning';
  const alert=admin&&state.members.some(m=>count(m)>=2);
  const tabs=admin?[['planning','Planning'],['equipe','Rappels'],['export','Images'],['reglages','Réglages']]:[['planning','Planning'],['export','Images']];
  if(!tabs.some(t=>t[0]===tab))tab='planning';
  $('nav').innerHTML=tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}${k==='equipe'&&alert?' <span class="alert">●</span>':''}</button>`).join('');
  $('main').innerHTML=({planning:vPlanning,equipe:vEquipe,export:vExport,reglages:vReglages})[tab]();
}

function nameTag(n){return `<span class="nm ${admin&&count(n)>=2?'bad':''}" style="color:${color(n)}">${esc(n)}</span>`}

function vPlanning(){
  const today=iso(new Date());
  let h=`<div class="chef"><div class="t">CHEF DE CHAMBRE</div><div class="n">${esc(state.chef)}</div><div class="s">Vérification <b>tous les jours</b> : lits faits, rien qui traîne, rangement.</div></div>`;
  h+=`<table class="pl ${admin?'adm':''}"><colgroup><col style="width:15%"><col><col><col><col></colgroup>
  <thead><tr><th>Jour</th>${COLS.map(c=>`<th>${c.s}</th>`).join('')}</tr></thead><tbody>`;
  DAYS.forEach((dn,d)=>{
    const dd=dayDate(d),isT=iso(dd)===today;
    h+=`<tr class="${isT?'today':''}"><td class="d">${isT?'<span class="blink">&gt;</span>':''}${DAYS_S[d]}<br><small>${fr(dd)}</small></td>`;
    COLS.forEach(c=>{
      h+=`<td class="c">${c.t.map(t=>`<span ${admin?`onclick="pick(${d},${t})"`:''}>${nameTag(state.plan[d][t])}</span>`).join('')}</td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  if((state.fixed||[]).length)h+=`<p class="hint">Tous les jours : ${state.fixed.map(f=>`${esc(f.name)} = ${esc(f.task)}`).join(' · ')}</p>`;
  if(admin){
    h+=`<h4>Modifier le planning</h4>
    <button class="btn gold" onclick="mix()">Mix aléatoire</button>
    <p class="hint">Le mix évite que quelqu'un refasse la même tâche 2 jours de suite et respecte les tâches fixes (Réglages).<br>Pour modifier à la main, appuie sur un nom dans le tableau.</p>`;
  }else{
    h+=`<p class="hint">Lecture seule · le chef de chambre modifie via Admin</p>`;
  }
  return h;
}
function pick(d,t){
  if(!admin)return;
  const cur=state.plan[d][t];
  modal(`<h3>${DAYS[d]} · ${TASKS[t].l}</h3><div class="pick">${state.members.map((m,i)=>`<button class="btn ${m===cur?'gold':''}" onclick="setCell(${d},${t},${i})">${m===cur?'&gt; ':''}${esc(m)}</button>`).join('')}</div>
  <button class="btn" onclick="closeModal()">Annuler</button>`);
}
function setCell(d,t,i){
  if(!admin)return;const n=state.members[i];state.plan[d][t]=n;save();closeModal();render();
  const ty=TASKS[t].l,fixe=(state.fixed||[]).some(f=>f.name===n&&f.task===ty);
  if(!fixe&&((d>0&&typeOn(state.plan,d-1,n)===ty)||(d<6&&typeOn(state.plan,d+1,n)===ty)))toast(`Attention : ${n} fait ${ty} 2 jours de suite`);
  else toast('Planning modifié');
}
function mix(){
  if(!admin)return;
  if(!confirm('Mélanger le planning au hasard ? Le planning actuel sera remplacé.'))return;
  state.plan=generate(state);save();render();toast('Planning mélangé');
}
function addFixed(){
  if(!admin)return;
  const n=$('fxn').value,ty=$('fxt').value;if(!n||!ty)return;
  state.fixed=(state.fixed||[]).filter(f=>f.name!==n);
  if(state.fixed.filter(f=>f.task===ty).length>=capOf(ty)){toast(`${ty} : déjà ${capOf(ty)} personne(s) fixe(s)`);return}
  state.fixed.push({name:n,task:ty});state.plan=generate(state);save();render();toast(`${n} = ${ty} tous les jours`);
}
function delFixed(k){if(!admin)return;state.fixed.splice(k,1);state.plan=generate(state);save();render();toast('Tâche fixe retirée, planning refait')}

function vEquipe(){
  let h=`<p class="sub" style="margin:0 0 10px">Au <b>2<sup>e</sup> rappel</b>, la personne passe en <b style="color:#c00">rouge</b> et tu peux faire un compte rendu.</p>`;
  state.members.forEach((m,i)=>{
    const rs=rappelsOf(m),c=rs.length,bad=c>=2,last=rs[c-1];
    const st=c===0?'<span class="st ok">[ OK ]</span>':c===1?'<span class="st w">[ 1 RAPPEL ]</span>':`<span class="st r">[ ${c} RAPPELS ]</span>`;
    h+=`<fieldset class="grp ${bad?'bad':''}"><legend>${esc(m)}${m===state.chef?' (CHEF)':''}</legend>
    ${st}${last?`<div class="sub">Dernier : ${frS(last.date)} · ${esc(last.task)}${last.motif?' — '+esc(last.motif):''}</div>`:''}
    <div class="row2"><button class="btn ${bad?'red':''}" onclick="addRappel(${i})">+ Rappel</button><button class="btn" onclick="histo(${i})">Historique</button></div>
    ${bad?`<button class="btn gold" onclick="compteRendu(${i})">Faire le compte rendu</button>`:''}</fieldset>`;
  });
  if(state.reports.length){
    h+='<h4>Comptes rendus enregistrés</h4>';
    state.reports.slice().reverse().forEach(r=>{
      h+=`<fieldset class="grp" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>${esc(r.name)}</b><div class="sub">${frS(r.date)} · ${r.items.length} manquement(s)</div></div><button class="btn sm" onclick="showReport('${r.id}')">Ouvrir</button></fieldset>`;
    });
  }
  return h;
}

/* ---------- rappels ---------- */
function addRappel(i){
  const m=state.members[i];
  modal(`<h3>Rappel — ${esc(m)}</h3>
  <div class="f"><span>Date</span><input type="date" id="rd" value="${iso(new Date())}" onchange="preTask(${i})"></div>
  <div class="f"><span>Tâche concernée</span><select id="rt">${MOTIFS.map(x=>`<option>${x}</option>`).join('')}</select></div>
  <div class="f"><span>Ce qui a été mal fait</span><textarea id="rm" rows="3" placeholder="Ex : poubelle pas descendue avant l'appel"></textarea></div>
  <div class="row2"><button class="btn red" onclick="saveRappel(${i})">Enregistrer</button><button class="btn" onclick="closeModal()">Annuler</button></div>`);
  preTask(i);
}
function preTask(i){
  const v=$('rd').value;if(!v)return;
  const d=(new Date(v+'T12:00:00').getDay()+6)%7;
  const ts=tasksOf(state.members[i],d);
  if(ts[0])$('rt').value=ts[0];
}
function saveRappel(i){
  const m=state.members[i],date=$('rd').value||iso(new Date());
  state.rappels.push({id:uid(),name:m,date,task:$('rt').value,motif:$('rm').value.trim()});
  save();closeModal();render();
  const c=count(m);
  toast(c>=2?`${c}e rappel : ${m} passe en rouge`:`Rappel ajouté pour ${m}`);
}
function histo(i){
  const m=state.members[i],rs=rappelsOf(m);
  modal(`<h3>Historique — ${esc(m)}</h3>
  ${rs.length?rs.map(r=>`<div class="hist"><div><b>${frS(r.date)}</b> · ${esc(r.task)}<div class="sub">${esc(r.motif||'—')}</div></div><button class="x" onclick="delRappel('${r.id}',${i})"></button></div>`).join(''):'<p>Aucun rappel.</p>'}
  ${rs.length?`<button class="btn" onclick="resetRappels(${i})">Remettre ses rappels à zéro</button>`:''}
  <button class="btn" onclick="closeModal()">Fermer</button>`);
}
function delRappel(id,i){if(!confirm('Supprimer ce rappel ?'))return;state.rappels=state.rappels.filter(r=>r.id!==id);save();render();histo(i)}
function resetRappels(i){const m=state.members[i];if(!confirm(`Remettre les rappels de ${m} à zéro ?`))return;state.rappels=state.rappels.filter(r=>r.name!==m);save();closeModal();render();toast('Rappels remis à zéro')}

/* ---------- compte rendu ---------- */
function compteRendu(i){
  const m=state.members[i],rs=rappelsOf(m);
  const obs=`Malgré ${rs.length} rappels, ${m} n'a pas effectué correctement les tâches qui lui étaient attribuées dans la chambre 128.`;
  modal(`<h3>Compte rendu — ${esc(m)}</h3>
  <p class="sub" style="margin-top:0">Rédigé par ${esc(state.chef)}, chef de chambre</p>
  <h4>Manquements (${rs.length})</h4>
  ${rs.map(r=>`<div class="hist"><div><b>${esc(frLong(r.date))}</b><div>${esc(r.task)} — ${esc(r.motif||'—')}</div></div></div>`).join('')}
  <div class="f" style="margin-top:10px"><span>Observations du chef de chambre</span><textarea id="obs" rows="4">${esc(obs)}</textarea></div>
  <label style="display:flex;gap:6px;align-items:center;font-size:11px;margin:6px 0"><input type="checkbox" id="rz" style="width:auto"> Remettre ses rappels à zéro après</label>
  <button class="btn gold" onclick="saveReport(${i})">Enregistrer et générer l'image</button>
  <button class="btn" onclick="closeModal()">Annuler</button>`);
}
function saveReport(i){
  const m=state.members[i];
  const r={id:uid(),name:m,date:iso(new Date()),chef:state.chef,items:rappelsOf(m).map(x=>({date:x.date,task:x.task,motif:x.motif})),obs:$('obs').value.trim()};
  state.reports.push(r);
  if($('rz').checked)state.rappels=state.rappels.filter(x=>x.name!==m);
  save();render();showReport(r.id);
}
function reportText(r){
  return `COMPTE RENDU — Chambre 128\nConcerné : ${r.name}\nRédigé par : ${r.chef}, chef de chambre\nDate : ${frLong(r.date)}\n\nManquements constatés (${r.items.length}) :\n`+
    r.items.map(it=>`- ${frLong(it.date)} : ${it.task} — ${it.motif||'—'}`).join('\n')+`\n\nObservations :\n${r.obs||'—'}`;
}
function showReport(id){
  const r=state.reports.find(x=>x.id===id);if(!r)return;
  showImg(drawReport(r),`compte-rendu-${slug(r.name)}-${r.date}.png`,`Compte rendu — ${r.name}`,
    `<button class="btn" onclick="copyReport('${id}')">Copier le texte</button><button class="btn" style="color:#c00" onclick="delReport('${id}')">Supprimer ce compte rendu</button>`);
}
function copyReport(id){
  const r=state.reports.find(x=>x.id===id);
  if(navigator.clipboard)navigator.clipboard.writeText(reportText(r)).then(()=>toast('Texte copié'),()=>toast('Copie impossible'));
  else toast('Copie impossible');
}
function delReport(id){if(!confirm('Supprimer ce compte rendu ?'))return;state.reports=state.reports.filter(r=>r.id!==id);save();closeModal();render()}

/* ---------- images / réglages ---------- */
function vExport(){
  return `<fieldset class="grp"><legend>Planning global</legend><p class="sub" style="margin-top:0">Le tableau complet de la semaine, à envoyer sur le groupe.</p><button class="btn go" onclick="exportGlobal()">Générer l'image</button></fieldset>
  <fieldset class="grp"><legend>Planning par personne</legend><div class="pick">${state.members.map((m,i)=>`<button class="btn" onclick="exportPerson(${i})">${esc(m)}</button>`).join('')}</div></fieldset>`;
}
function vReglages(){
  return `<fieldset class="grp"><legend>État</legend><div class="sub" style="margin:0">${remote?'[EN LIGNE] Les modifs sont visibles par tout le monde.':'[LOCAL] Les modifs restent sur ce téléphone.'}</div></fieldset>
  <fieldset class="grp"><legend>Tâches fixes</legend>
    <div class="sub" style="margin:0 0 6px">Une personne fait la même tâche tous les jours, le reste est réparti automatiquement entre les autres. Tu peux en mettre plusieurs (2 max sur TIG).</div>
    ${(state.fixed||[]).length?state.fixed.map((f,k)=>`<div class="hist" style="border-left-color:var(--fg);align-items:center"><div><b>${esc(f.name)}</b> → ${esc(f.task)} tous les jours</div><button class="x" onclick="delFixed(${k})">X</button></div>`).join(''):'<p class="sub">Aucune tâche fixe.</p>'}
    <div class="row2" style="margin-top:6px"><select id="fxn">${state.members.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}</select>
    <select id="fxt">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <button class="btn" onclick="addFixed()">Ajouter et refaire le planning</button>
  </fieldset>
  <fieldset class="grp"><legend>Paramètres</legend>
    <div class="f"><span>Semaine du (lundi)</span><input type="date" value="${state.week}" onchange="setWeek(this.value)"></div>
    <div class="f"><span>Chef de chambre</span><select onchange="setChef(this.value)">${state.members.map(m=>`<option value="${esc(m)}" ${m===state.chef?'selected':''}>${esc(m)}</option>`).join('')}</select></div>
    <div class="f"><span>Noms</span>${state.members.map((m,i)=>`<input value="${esc(m)}" style="margin-bottom:4px" onchange="rename(${i},this.value)">`).join('')}</div>
  </fieldset>
  <fieldset class="grp"><legend>Sauvegarde</legend>
    <div class="sub" style="margin:0">Copie de secours de tout (planning, rappels, comptes rendus).</div>
    <button class="btn" onclick="exportJSON()">Exporter la sauvegarde</button>
    <label class="btn">Importer une sauvegarde<input type="file" accept=".json,application/json" hidden onchange="importJSON(this)"></label>
    <button class="btn" onclick="logout()">Quitter le mode admin</button>
    <button class="btn red" onclick="resetAll()">Tout réinitialiser</button>
  </fieldset>`;
}
function setWeek(v){if(!v)return;state.week=mondayISO(new Date(v+'T12:00:00'));save();render();toast('Semaine mise à jour')}
function setChef(v){state.chef=v;save();render();toast('Chef de chambre : '+v)}
function rename(i,v){
  v=v.trim().toUpperCase();const old=state.members[i];
  if(!v||v===old||state.members.includes(v)){render();return}
  state.members[i]=v;
  state.plan=state.plan.map(day=>day.map(n=>n===old?v:n));
  state.rappels.forEach(r=>{if(r.name===old)r.name=v});
  state.reports.forEach(r=>{if(r.name===old)r.name=v;if(r.chef===old)r.chef=v});
  if(state.chef===old)state.chef=v;
  (state.fixed||[]).forEach(f=>{if(f.name===old)f.name=v});
  save();render();toast('Nom modifié');
}
function exportJSON(){
  const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='chambre128-sauvegarde.json';document.body.appendChild(a);a.click();a.remove();
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const s=norm(JSON.parse(rd.result));if(!s)throw 0;state=s;save();render();toast('Sauvegarde importée')}catch(e){toast('Fichier invalide')}};
  rd.readAsText(f);
}
function resetAll(){if(confirm('Tout effacer (planning, rappels, comptes rendus) ?')){state=defaults();save();render();toast('Réinitialisé')}}

/* ---------- pop-up / bulle ---------- */
function modal(html){
  const m=$('modal');const t=html.match(/^\s*<h3>([\s\S]*?)<\/h3>/);
  const title=t?t[1]:'Chambre 128';const body=t?html.slice(t[0].length):html;
  m.innerHTML=`<div class="win dlg"><div class="tb">${title}<div class="ctl"><span class="x" onclick="closeModal()">[X]</span></div></div><div class="wc">${body}</div></div>`;
  m.hidden=false;m.onclick=e=>{if(e.target===m)closeModal()};
}
function closeModal(){$('modal').hidden=true;$('modal').innerHTML=''}
let tt;function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);clearTimeout(tt);tt=setTimeout(()=>d.remove(),2300)}

/* ---------- dessin des images (style terminal) ---------- */
const G='#33ff66',GD='#1e8c3e',BK='#0a0d0a',HI='#0f2a16';
const F=(s,w)=>`${w||'bold'} ${s}px "Courier New", Courier, monospace`;
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function txt(x,s,X,Y,font,col,al){x.font=font;x.fillStyle=col;x.textAlign=al||'left';x.textBaseline='middle';x.fillText(s,X,Y)}
function fit(x,s,maxW,size,w){let z=size;x.font=F(z,w);while(x.measureText(s).width>maxW&&z>10){z--;x.font=F(z,w)}return F(z,w)}
function wrap(x,t,w){const out=[];String(t).split('\n').forEach(p=>{let line='';p.split(' ').forEach(word=>{const test=line?line+' '+word:word;if(x.measureText(test).width>w&&line){out.push(line);line=word}else line=test});out.push(line)});return out}
function frame(x,W,H){x.fillStyle=BK;x.fillRect(0,0,W,H);x.strokeStyle=G;x.lineWidth=4;x.strokeRect(24,24,W-48,H-48)}
function box(x,X,Y,w,h,fill,lw,col){if(fill){x.fillStyle=fill;x.fillRect(X,Y,w,h)}x.strokeStyle=col||GD;x.lineWidth=lw||2;x.strokeRect(X,Y,w,h)}
function chefBox(x,X,Y,w,label){box(x,X,Y,w,70,null,3,G);txt(x,label,X+w/2,Y+35,fit(x,label,w-40,28),G,'center')}

function drawGlobal(){
  const W=1500,P=60,rowH=112,headH=70,dayW=210,top=330;
  const H=top+headH+7*rowH+80;
  const c=cv(W,H),x=c.getContext('2d');frame(x,W,H);
  txt(x,'CHAMBRE 128',P,100,F(64),G);
  txt(x,`PLANNING · SEMAINE DU ${fr(dayDate(0))} AU ${fr(dayDate(6))}`,P,160,F(28,'normal'),GD);
  chefBox(x,P,210,W-2*P,`CHEF DE CHAMBRE : ${state.chef} — VERIFICATION LITS ET RANGEMENT CHAQUE JOUR`);
  const colW=(W-2*P-dayW)/COLS.length;
  box(x,P,top,dayW,headH);txt(x,'JOUR',P+dayW/2,top+headH/2,F(26),G,'center');
  COLS.forEach((co,k)=>{const X=P+dayW+colW*k;box(x,X,top,colW,headH);txt(x,co.l.toUpperCase(),X+colW/2,top+headH/2,fit(x,co.l.toUpperCase(),colW-16,26),G,'center')});
  x.fillStyle=G;x.fillRect(P,top+headH-2,W-2*P,3);
  DAYS.forEach((dn,d)=>{
    const y=top+headH+d*rowH;
    box(x,P,y,dayW,rowH);
    txt(x,dn.toUpperCase(),P+dayW/2,y+rowH/2-15,fit(x,dn.toUpperCase(),dayW-20,28),G,'center');
    txt(x,fr(dayDate(d)),P+dayW/2,y+rowH/2+20,F(22,'normal'),GD,'center');
    COLS.forEach((co,k)=>{
      const X=P+dayW+colW*k;box(x,X,y,colW,rowH);
      const names=co.t.map(t=>state.plan[d][t]);
      names.forEach((n,j)=>{const cy=names.length===1?y+rowH/2:y+rowH/2+(j?24:-24);txt(x,n,X+colW/2,cy,fit(x,n,colW-24,names.length===1?32:28),G,'center')});
      if(names.length===2){x.strokeStyle=GD;x.setLineDash([6,6]);x.lineWidth=1.5;x.beginPath();x.moveTo(X+20,y+rowH/2);x.lineTo(X+colW-20,y+rowH/2);x.stroke();x.setLineDash([])}
    });
  });
  x.strokeStyle=G;x.lineWidth=4;x.strokeRect(P,top,W-2*P,headH+7*rowH);
  return c;
}

function drawPerson(i){
  const m=state.members[i],isChef=m===state.chef,W=1080,P=56,rowH=108,headH=66;
  const top=isChef?340:260,H=top+headH+7*rowH+80;
  const c=cv(W,H),x=c.getContext('2d');frame(x,W,H);
  txt(x,'CHAMBRE 128 · PLANNING PERSONNEL',P,90,F(24,'normal'),GD);
  txt(x,m,P,160,fit(x,m,W-2*P,72),G);
  txt(x,`SEMAINE DU ${fr(dayDate(0))} AU ${fr(dayDate(6))}`,P,220,F(26,'normal'),GD);
  if(isChef)chefBox(x,P,250,W-2*P,'CHEF DE CHAMBRE — VERIF. LITS ET RANGEMENT CHAQUE JOUR');
  const dayW=260,tW=W-2*P-dayW;
  box(x,P,top,dayW,headH);txt(x,'JOUR',P+dayW/2,top+headH/2,F(26),G,'center');
  box(x,P+dayW,top,tW,headH);txt(x,'TACHE',P+dayW+tW/2,top+headH/2,F(26),G,'center');
  x.fillStyle=G;x.fillRect(P,top+headH-2,W-2*P,3);
  DAYS.forEach((dn,d)=>{
    const y=top+headH+d*rowH,ts=tasksOf(m,d);
    box(x,P,y,dayW,rowH);
    txt(x,dn.toUpperCase(),P+dayW/2,y+rowH/2-15,fit(x,dn.toUpperCase(),dayW-20,28),G,'center');
    txt(x,fr(dayDate(d)),P+dayW/2,y+rowH/2+20,F(22,'normal'),GD,'center');
    box(x,P+dayW,y,tW,rowH);
    const label=ts.length?ts.join(' + ').toUpperCase():'REPOS';
    txt(x,label,P+dayW+tW/2,y+rowH/2,fit(x,label,tW-40,32),ts.length?G:GD,'center');
  });
  x.strokeStyle=G;x.lineWidth=4;x.strokeRect(P,top,W-2*P,headH+7*rowH);
  return c;
}

function drawReport(r){
  const W=1240,P=80,maxW=W-2*P;
  const m=cv(10,10).getContext('2d');
  m.font=F(26,'normal');const itemLines=r.items.map(it=>wrap(m,`${it.task} — ${it.motif||'—'}`,maxW-40));
  const obsLines=wrap(m,r.obs||'—',maxW);
  const itemsH=itemLines.reduce((s,l)=>s+40+l.length*38+24,0);
  const H=440+itemsH+20+60+obsLines.length*40+50+220;
  const c=cv(W,H),x=c.getContext('2d');
  x.fillStyle='#fbfaf6';x.fillRect(0,0,W,H);
  const K='#111';
  txt(x,'COMPTE RENDU',P,90,F(56),K);
  txt(x,'CHAMBRE 128 · 4E COMPAGNIE',P,145,F(24,'normal'),'#444');
  x.fillStyle=K;x.fillRect(P,180,maxW,3);
  txt(x,'CONCERNE    : '+r.name,P,225,F(30),K);
  txt(x,'REDIGE PAR  : '+r.chef+', chef de chambre',P,270,F(26,'normal'),K);
  txt(x,'DATE        : '+frLong(r.date),P,310,F(26,'normal'),K);
  txt(x,'MANQUEMENTS : '+r.items.length,P,350,F(26),K);
  x.fillStyle='#999';x.fillRect(P,380,maxW,2);
  txt(x,'MANQUEMENTS CONSTATES',P,412,F(24),K);
  let y=440;
  r.items.forEach((it,k)=>{
    const bh=40+itemLines[k].length*38;
    x.fillStyle=K;x.fillRect(P,y,4,bh);
    txt(x,frLong(it.date),P+22,y+18,F(26),K);
    itemLines[k].forEach((l,j)=>txt(x,l,P+22,y+56+j*38,F(26,'normal'),'#333'));
    y+=bh+24;
  });
  y+=20;
  txt(x,'OBSERVATIONS DU CHEF DE CHAMBRE',P,y+20,F(24),K);
  y+=60;
  obsLines.forEach((l,j)=>txt(x,l,P,y+j*40+20,F(26,'normal'),'#222'));
  y+=obsLines.length*40+50;
  txt(x,'Signature du chef de chambre :',W-P-440,y+20,F(22,'normal'),'#444');
  x.fillStyle='#888';x.fillRect(W-P-440,y+110,440,2);
  txt(x,r.chef,W-P,y+140,F(22),'#444','right');
  return c;
}

let lastImg=null;
function showImg(c,name,title,extra){
  const url=c.toDataURL('image/png');lastImg={c,name};
  modal(`<h3>${esc(title)}</h3><img class="prev" src="${url}" alt="">
  <a class="btn go" href="${url}" download="${esc(name)}">Télécharger l'image</a>
  <button class="btn" onclick="shareImg()">Partager (Snap, WhatsApp…)</button>
  ${extra||''}
  <p class="hint">Sur iPhone : appui long sur l'image → « Enregistrer dans Photos »</p>
  <button class="btn" onclick="closeModal()">Fermer</button>`);
}
function shareImg(){
  if(!lastImg)return;
  lastImg.c.toBlob(async b=>{
    const f=new File([b],lastImg.name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
    else toast('Partage indisponible, utilise Télécharger');
  },'image/png');
}
function exportGlobal(){showImg(drawGlobal(),`planning-chambre-128-${state.week}.png`,'Planning global')}
function exportPerson(i){const m=state.members[i];showImg(drawPerson(i),`planning-${slug(m)}-${state.week}.png`,'Planning — '+m)}

/* ---------- démarrage ---------- */
admin=getCode().trim().toLowerCase()===CODE;
render();
sync();
</script>
